[package]
name = "xlcalc-xll"
description = "XLL host: loads .xll add-ins, implements the Excel C API callback and their worksheet functions"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
xlcalc = { workspace = true }
xlcalc-xlsx = { path = "../xlsx", version = "0.6.0" }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_LibraryLoader",
] }
