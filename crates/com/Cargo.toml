[package]
name = "xlcalc-com"
description = "XlCalc.Application: Excel's object model as an out-of-process COM server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "xlcalc-com"
path = "src/main.rs"

[dependencies]
xlcalc-om = { path = "../om" }
xlcalc-variant = { path = "../variant" }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "=0.62.2"
