[package]
name = "xlcalc-conformance"
description = "Records Excel results and replays them against xlcalc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "conform"
path = "src/main.rs"

[features]
covsig = []

[dependencies]
xlcalc.workspace = true
serde.workspace = true
serde_json.workspace = true
xlcalc-xlsx = { path = "../xlsx" }
xlcalc-om = { path = "../om" }
xlcalc-variant = { path = "../variant" }
xlcalc-vba = { path = "../vba" }
