[workspace]
resolver = "2"
members = ["crates/engine", "crates/cli", "crates/conformance"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "0BSD"

[workspace.dependencies]
xlcalc = { path = "crates/engine" }
rustc-hash = "2.0"
smallvec = { version = "1.13", features = ["union"] }
rstar = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
debug = 1

[profile.dev.package."*"]
opt-level = 2
