[workspace]
resolver = "2"
members = ["crates/vbaproject", "crates/vba", "crates/engine", "crates/cli", "crates/conformance", "crates/xlsx", "crates/om", "crates/variant", "crates/com"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "0BSD"
repository = "https://github.com/zac-scheiwe/xlcalc"

[workspace.dependencies]
xlcalc = { path = "crates/engine", version = "0.5.0" }
rustc-hash = "2.0"
smallvec = { version = "1.13", features = ["union"] }
rstar = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
debug = 1

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
debug = "line-tables-only"
